<!-- Device Form Modal -->
<div id="device-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="device-modal-title">Install Device</h3>
            <button class="modal-close" id="device-modal-close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="device-form" class="modal-form">
            <input type="hidden" id="device-id">
            <input type="hidden" id="device-piece-name">
            <input type="hidden" id="device-piece-directory">
            <input type="hidden" id="device-piece-hash">
            <input type="hidden" id="device-icon-class">
            <input type="hidden" id="device-connection-type">
            <div class="form-group">
                <label for="device-label">Label <span class="required">*</span></label>
                <input type="text" id="device-label" required placeholder="e.g., Temperature Sensor #1">
            </div>
            <input type="hidden" id="device-type">
            <div class="form-group">
                <label>Tags</label>
                <div id="device-tags" class="device-tags-container"></div>
            </div>
            <div class="form-group">
                <label for="device-platform">Platform <span class="required">*</span></label>
                <select id="device-platform" required>
                    <option value="">-- Select a platform --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="device-description">Description</label>
                <textarea id="device-description" rows="2" placeholder="Optional description..."></textarea>
            </div>

            <!-- Dependency Section (shown when piece has a device dependency) -->
            <div id="device-dependency-section" class="form-group hidden">
                <label for="device-dependency-select">Depends on <span class="required">*</span></label>
                <p id="device-dependency-desc" class="form-help-text"></p>
                <select id="device-dependency-select" required>
                    <option value="">-- Select a device --</option>
                </select>
                <p id="device-dependency-warning" class="form-warning hidden"></p>
                <div id="device-dependency-matches" class="dependency-matches-container hidden"></div>
            </div>

            <!-- Dynamic Connection Section (Collapsible) -->
            <div id="device-connection-section" class="form-collapsible hidden collapsed">
                <div class="form-section-divider"></div>
                <div class="form-collapsible-header" id="device-connection-toggle">
                    <i class="fa-solid fa-chevron-right form-collapsible-icon"></i>
                    <i class="fa-solid fa-link"></i>
                    <span>Connection Settings</span>
                </div>
                <div class="form-collapsible-content">
                    <!-- Bus Selection (for bus-based connections) -->
                    <div id="device-bus-group" class="form-group hidden">
                        <label for="device-bus-select">Bus <span class="required">*</span></label>
                        <select id="device-bus-select">
                            <option value="">-- Select a bus --</option>
                            <option value="__new__">+ Create new bus...</option>
                        </select>
                    </div>

                    <!-- Device-specific connection settings -->
                    <div id="device-connection-fields">
                        <!-- Generated dynamically -->
                    </div>
                </div>
            </div>

            <!-- Legacy connection string (hidden, for backwards compatibility) -->
            <div class="form-group hidden">
                <label for="device-connection">Connection String</label>
                <input type="text" id="device-connection" placeholder="e.g., 192.168.1.100:502 or /dev/ttyUSB0">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="device-cancel">Cancel</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-save"></i>
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
