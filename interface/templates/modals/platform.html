<!-- Platform Form Modal -->
<div id="platform-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="platform-modal-title">Add Platform</h3>
            <button class="modal-close" id="platform-modal-close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="platform-form" class="modal-form">
            <input type="hidden" id="platform-id">
            <div class="form-group">
                <label for="platform-name">Name <span class="required">*</span></label>
                <input type="text" id="platform-name" required placeholder="e.g., Local Docker">
            </div>
            <div class="form-group">
                <label for="platform-description">Description</label>
                <textarea id="platform-description" rows="3" placeholder="Optional description..."></textarea>
            </div>
            <div class="form-group">
                <label for="platform-host">Host <span class="required">*</span></label>
                <input type="text" id="platform-host" required placeholder="e.g., localhost:2375">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="platform-cancel">Cancel</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-save"></i>
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
