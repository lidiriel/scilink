<!-- Experiment Form Modal -->
<div id="experiment-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="experiment-modal-title">New Experiment</h3>
            <button class="modal-close" id="experiment-modal-close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="experiment-form" class="modal-form">
            <input type="hidden" id="experiment-id">
            <div class="form-group">
                <label for="experiment-name">Name <span class="required">*</span></label>
                <input type="text" id="experiment-name" required placeholder="e.g., RNA Sequencing Analysis">
            </div>
            <div class="form-group">
                <label for="experiment-description">Description</label>
                <textarea id="experiment-description" rows="3" placeholder="Describe your experiment..."></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="experiment-cancel">Cancel</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-save"></i>
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
