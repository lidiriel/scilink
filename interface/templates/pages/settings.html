<!-- Page: Settings -->
<div id="page-settings" class="page-content">
    <div class="page-header">
        <h1>Settings</h1>
    </div>
    <div class="page-body">
        <div class="settings-section">
            <h2 class="settings-section-title">
                <i class="fa-solid fa-server"></i>
                Platforms
            </h2>
            <p class="settings-section-desc">Configure execution platforms and their bus connections for your workflows.</p>
            <div id="platforms-list" class="platforms-list">

            <button id="add-platform-btn" class="settings-add-btn">
                <i class="fa-solid fa-plus"></i>
                Add Platform
            </button>
        </div>

        {% include 'modals/platform.html' %}
    </div>
</div>
